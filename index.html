<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="description"
content="Diamond News - Latest Indian cricket news, Team India, IPL and player updates.">

<title>Diamond News | Indian Cricket</title>

<style>

/* =========================
   BASIC
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#050b16;
    color:white;
    padding-bottom:80px;
}


/* =========================
   HEADER
========================= */

header{
    background:linear-gradient(
        135deg,
        #061b49,
        #092e68
    );

    padding:18px 16px;

    position:sticky;
    top:0;

    z-index:100;

    box-shadow:
        0 4px 18px rgba(0,0,0,.4);
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:.3px;
}

.logo span{
    color:#18cfff;
}

.tagline{
    font-size:12px;
    color:#b9c8dc;
    margin-top:4px;
}

.auto{
    background:#00c853;
    color:white;

    font-size:11px;
    font-weight:bold;

    padding:8px 11px;

    border-radius:20px;

    white-space:nowrap;
}


/* =========================
   HERO
========================= */

.hero{
    margin:18px 16px;

    min-height:220px;

    border:1px solid #23466e;

    border-radius:22px;

    display:flex;
    flex-direction:column;
    justify-content:flex-end;

    padding:22px;

    background:
        linear-gradient(
            rgba(4,17,39,.55),
            rgba(4,17,39,.95)
        ),
        url("https://images.unsplash.com/photo-1531415074968-036ba1b575da?auto=format&fit=crop&w=1200&q=80");

    background-size:cover;
    background-position:center;

    overflow:hidden;
}

.hero h1{
    font-size:29px;
    margin-bottom:8px;
}

.hero p{
    color:#c0cee0;
    font-size:14px;
    line-height:1.5;
}


/* =========================
   FILTERS
========================= */

.filters{
    display:flex;
    gap:9px;

    padding:5px 16px 18px;

    overflow-x:auto;

    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter{
    border:1px solid #29415f;

    background:#0c1c34;

    color:white;

    padding:10px 17px;

    border-radius:22px;

    white-space:nowrap;

    cursor:pointer;

    font-size:13px;
}

.filter.active{
    background:#18cfff;

    color:#00101d;

    border-color:#18cfff;

    font-weight:bold;
}


/* =========================
   SECTION
========================= */

.section{
    padding:0 16px;
}

.section-title{
    font-size:22px;
    font-weight:800;

    margin:
        5px 0
        16px;
}


/* =========================
   NEWS CARD
========================= */

.news-card{
    background:#0b1729;

    border:1px solid #1d3554;

    border-radius:18px;

    margin-bottom:17px;

    overflow:hidden;

    box-shadow:
        0 5px 20px rgba(0,0,0,.25);
}


/* NEWS IMAGE */

.news-image{
    height:190px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #092d61,
            #071629
        );

    overflow:hidden;
}

.news-image img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}


/* fallback */

.image-fallback::after{
    content:"🏏";

    font-size:60px;
}


/* NEWS CONTENT */

.news-content{
    padding:17px;
}

.news-source{
    font-size:12px;

    font-weight:bold;

    color:#18cfff;

    text-transform:uppercase;

    margin-bottom:8px;
}

.news-title{
    font-size:19px;

    line-height:1.4;

    margin-bottom:10px;
}

.news-date{
    font-size:12px;

    color:#8295ae;

    margin-bottom:15px;
}

.read-more{
    display:inline-block;

    background:#18cfff;

    color:#00101d;

    font-weight:bold;

    text-decoration:none;

    padding:11px 15px;

    border-radius:9px;

    font-size:13px;
}


/* =========================
   LOADING
========================= */

.loading{
    text-align:center;

    padding:50px 15px;

    color:#9db0c8;

    font-size:15px;
}

.error{
    text-align:center;

    padding:40px 15px;

    color:#ff8585;

    line-height:1.5;
}


/* =========================
   WHATSAPP FLOATING BUTTON
========================= */

.whatsapp{
    position:fixed;

    right:16px;
    bottom:88px;

    z-index:200;

    background:#25d366;

    color:white;

    text-decoration:none;

    font-weight:bold;

    padding:17px 21px;

    border-radius:45px;

    box-shadow:
        0 5px 25px rgba(0,0,0,.45);

    font-size:15px;
}


/* =========================
   WHATSAPP POPUP
========================= */

.popup-bg{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.80);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:1000;

    padding:20px;
}

.popup{
    width:100%;

    max-width:390px;

    background:#0c1b30;

    border:1px solid #25466e;

    border-radius:23px;

    padding:29px 22px;

    text-align:center;

    box-shadow:
        0 15px 50px rgba(0,0,0,.65);
}

.popup-logo{
    font-size:48px;

    margin-bottom:8px;
}

.popup h2{
    font-size:23px;

    margin-bottom:10px;
}

.popup p{
    color:#aebed2;

    font-size:14px;

    line-height:1.5;

    margin-bottom:19px;
}

.message-box{
    background:#071225;

    border:1px solid #29415f;

    padding:14px;

    border-radius:10px;

    margin-bottom:18px;

    font-size:14px;

    color:white;
}

.chat-button{
    display:block;

    width:100%;

    background:#25d366;

    color:white;

    padding:15px;

    border-radius:11px;

    text-decoration:none;

    font-weight:bold;

    margin-bottom:10px;
}

.continue-button{
    display:block;

    width:100%;

    background:#162b47;

    color:white;

    padding:13px;

    border:0;

    border-radius:11px;

    font-weight:bold;

    cursor:pointer;
}


/* =========================
   FOOTER
========================= */

footer{
    margin-top:30px;

    padding:27px 16px;

    background:#030813;

    border-top:1px solid #1c304b;

    text-align:center;
}

footer p{
    font-size:12px;

    color:#7f91a8;

    margin-bottom:13px;
}

.footer-links{
    display:flex;

    justify-content:center;

    gap:20px;
}

.footer-links a{
    color:#18cfff;

    font-size:12px;

    text-decoration:none;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;

    bottom:0;
    left:0;
    right:0;

    height:70px;

    background:#071225;

    border-top:1px solid #203957;

    display:flex;

    justify-content:space-around;

    align-items:center;

    z-index:150;
}

.bottom-nav a{
    text-decoration:none;

    color:#91a5bd;

    font-size:11px;

    text-align:center;
}

.bottom-nav a span{
    display:block;

    font-size:21px;

    margin-bottom:4px;
}


/* =========================
   POLICY MODAL
========================= */

.policy-bg{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.82);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:1200;

    padding:20px;
}

.policy{
    width:100%;

    max-width:500px;

    max-height:80vh;

    overflow-y:auto;

    background:#0b1729;

    border:1px solid #29415f;

    border-radius:20px;

    padding:25px;
}

.policy h2{
    margin-bottom:15px;
}

.policy h3{
    margin-top:17px;

    margin-bottom:7px;
}

.policy p{
    color:#b5c3d5;

    font-size:13px;

    line-height:1.6;

    margin-bottom:10px;
}

.close-policy{
    width:100%;

    margin-top:15px;

    padding:12px;

    background:#18cfff;

    color:#00101d;

    border:0;

    border-radius:9px;

    font-weight:bold;
}


/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

    main{
        max-width:900px;

        margin:auto;
    }

    .hero{
        min-height:300px;
    }

    .news-card{
        display:flex;
    }

    .news-image{
        width:300px;

        min-width:300px;

        height:auto;

        min-height:210px;
    }

    .news-content{
        flex:1;
    }

    .bottom-nav{
        display:none;
    }

    body{
        padding-bottom:20px;
    }

    .whatsapp{
        bottom:25px;
    }

}

</style>

</head>


<body>

<div class="header">

<div>

</div>

</div>

</div>

</header>
